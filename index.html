// DYNAMIC LABEL CREATOR WITH IMAGES/ FOLDER SUPPORT
function createDynamicProductTexture(name, price, imgPath, fallbackEmoji, color){
  const c=document.createElement('canvas');c.width=128;c.height=150;const x=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c);

  function render(img=null){
    x.fillStyle='#ffffff';x.fillRect(0,0,128,150);
    x.fillStyle=color||'#0284c7';x.fillRect(0,0,128,10);

    if(img){
      try{ x.drawImage(img,14,14,100,75); }
      catch(e){
        x.font='44px serif';x.textAlign='center';x.textBaseline='middle';
        x.fillText(fallbackEmoji||'📦',64,52);
      }
    } else {
      x.font='44px serif';x.textAlign='center';x.textBaseline='middle';
      x.fillText(fallbackEmoji||'📦',64,52);
    }

    x.fillStyle='#64748b';x.font='bold 11px system-ui,sans-serif';x.textAlign='center';
    x.fillText(name.slice(0,16),64,106,116);
    x.fillStyle='#0f172a';x.font='bold 13px system-ui,sans-serif';
    x.fillText(name.slice(16,32),64,122,116);
    x.fillStyle='#0284c7';x.font='900 15px system-ui,sans-serif';
    x.fillText('PKR '+price,64,140);
    tex.needsUpdate=true;
  }

  render(null);

  if(imgPath){
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>render(img);
    img.onerror=()=>render(null);
    img.src=imgPath;
  }
  return L({map:tex});
}

// 3D Trolley Builder
const metalMat=L({color:'#cbd5e1'}),wheelMat=L({color:'#18181b'}),handleGripMat=L({color:'#ef4444'}),miniItemGeo=new THREE.BoxGeometry(.11,.11,.11);
function createTrolley3D(){
  const tr=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(.52,.04,.7),metalMat);base.position.set(0,.2,0);tr.add(base);
  [[-.22,.08,-.26],[.22,.08,-.26],[-.22,.08,.26],[.22,.08,.26]].forEach(([wx,wy,wz])=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.04,10),wheelMat);
    w.rotation.z=Math.PI/2;w.position.set(wx,wy,wz);tr.add(w);
  });
  [[-.22,.48,-.28],[.22,.48,-.28],[-.22,.48,.28],[.22,.48,.28]].forEach(([lx,ly,lz])=>{
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.55),metalMat);leg.position.set(lx,ly,lz);tr.add(leg);
  });
  const basketMat=new THREE.MeshLambertMaterial({color:'#94a3b8',wireframe:true});
  const basket=new THREE.Mesh(new THREE.BoxGeometry(.54,.42,.72),basketMat);basket.position.set(0,.55,0);tr.add(basket);
  const basketBottom=new THREE.Mesh(new THREE.BoxGeometry(.52,.02,.7),metalMat);basketBottom.position.set(0,.35,0);tr.add(basketBottom);

  const handleBar=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.52),handleGripMat);
  handleBar.rotation.z=Math.PI/2;handleBar.position.set(0,.82,-.37);tr.add(handleBar);
  [-.22,.22].forEach(hx=>{
    const sup=new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,.2),metalMat);
    sup.position.set(hx,.74,-.36);sup.rotation.x=.35;tr.add(sup);
  });

  tr.itemsGroup=new THREE.Group();tr.itemsGroup.position.set(0,.38,0);tr.add(tr.itemsGroup);
  tr.itemsCount=0;
  return tr;
}

// Pixar Faces
function createPixarFaceTexture(type, eyeColor, skinTone){
  const fc=document.createElement('canvas');fc.width=512;fc.height=512;const fx=fc.getContext('2d');
  fx.fillStyle=skinTone;fx.fillRect(0,0,512,512);
  const blush=fx.createRadialGradient(90,320,10,90,320,70);blush.addColorStop(0,'rgba(244,114,182,0.4)');blush.addColorStop(1,'rgba(244,114,182,0)');
  fx.fillStyle=blush;fx.beginPath();fx.arc(90,320,70,0,Math.PI*2);fx.fill();
  const blush2=fx.createRadialGradient(422,320,10,422,320,70);blush2.addColorStop(0,'rgba(244,114,182,0.4)');blush2.addColorStop(1,'rgba(244,114,182,0)');
  fx.fillStyle=blush2;fx.beginPath();fx.arc(422,320,70,0,Math.PI*2);fx.fill();

  if(type==='girl'){
    fx.fillStyle='rgba(161,98,7,0.35)';
    [70,85,100,412,427,442,240,256,272].forEach((px,i)=>{fx.beginPath();fx.arc(px,315+((i%3)*6),2.2,0,Math.PI*2);fx.fill();});
  }
  fx.fillStyle='#2b1810';fx.lineWidth=10;fx.lineCap='round';
  fx.beginPath();fx.moveTo(80,160);fx.quadraticCurveTo(150,135,200,165);fx.stroke();
  fx.beginPath();fx.moveTo(312,165);fx.quadraticCurveTo(362,135,432,160);fx.stroke();
  fx.fillStyle='#ffffff';
  fx.beginPath();fx.ellipse(145,225,58,48,0,0,Math.PI*2);fx.fill();
  fx.beginPath();fx.ellipse(367,225,58,48,0,0,Math.PI*2);fx.fill();
  fx.fillStyle=eyeColor;
  fx.beginPath();fx.arc(150,225,32,0,Math.PI*2);fx.arc(362,225,32,0,Math.PI*2);fx.fill();
  fx.fillStyle='#0f172a';
  fx.beginPath();fx.arc(150,225,18,0,Math.PI*2);fx.arc(362,225,18,0,Math.PI*2);fx.fill();
  fx.fillStyle='#ffffff';
  fx.beginPath();fx.arc(140,215,9,0,Math.PI*2);fx.arc(352,215,9,0,Math.PI*2);fx.fill();
  fx.fillStyle='rgba(180,83,9,0.25)';
  fx.beginPath();fx.ellipse(256,310,14,8,0,0,Math.PI*2);fx.fill();
  fx.strokeStyle='#9f1239';fx.lineWidth=7;fx.beginPath();
  fx.arc(256,365,36,0.15*Math.PI,0.85*Math.PI);fx.stroke();
  return new THREE.CanvasTexture(fc);
}

function buildPixarCharacter(id, name, role, hasTrolley=false){
  const g=new THREE.Group();
  let skinTone='#fcd5b8', eyeColor='#2563eb', hairColor='#2b1810';
  let shirtColor='#3b82f6', pantsColor='#1e293b', shoeColor='#ffffff';

  if(id===1){ skinTone='#fbd2a4';eyeColor='#1e293b';hairColor='#18181b';shirtColor='#eab308';pantsColor='#18181b';shoeColor='#f97316';}
  else if(id===2){ skinTone='#fed7aa';eyeColor='#0284c7';hairColor='#451a03';shirtColor='#ef4444';pantsColor='#3b82f6';shoeColor='#ffffff';}
  else if(id===3){ skinTone='#fde2d0';eyeColor='#059669';hairColor='#1e293b';shirtColor='#84a98c';pantsColor='#52796f';shoeColor='#f472b6';}
  else if(id===4){ skinTone='#fed7aa';eyeColor='#0f172a';hairColor='#5c3a21';shirtColor='#38bdf8';pantsColor='#2563eb';shoeColor='#ffffff';}

  const skinMat=L({color:skinTone}),shirtMat=L({color:shirtColor}),pantsMat=L({color:pantsColor}),shoesMat=L({color:shoeColor}),hairMat=L({color:hairColor});
  const faceTex=createPixarFaceTexture(id===3?'girl':'boy', eyeColor, skinTone);
  const faceMat=new THREE.MeshLambertMaterial({map:faceTex});

  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.075,.085,.16,12),skinMat);neck.position.set(0,1.35,0);g.add(neck);
  const headGeo=new THREE.CylinderGeometry(.19,.16,.36,16);
  const headMats=[skinMat,skinMat,faceMat,skinMat,skinMat,skinMat];
  const head=new THREE.Mesh(headGeo,headMats);
  head.position.set(0,1.55,0);head.rotation.y=Math.PI/2;g.add(head);

  if(id===1){
    const hairBase=new THREE.Mesh(new THREE.SphereGeometry(.22,14,10,0,Math.PI*2,0,Math.PI/1.7),hairMat);hairBase.position.set(0,1.66,-.02);g.add(hairBase);
    for(let i=0;i<7;i++){
      const spike=new THREE.Mesh(new THREE.ConeGeometry(.06,.18,6),hairMat);
      spike.position.set(-.1+i*.035,1.82+.01*(i%2),-.04+Math.sin(i)*.03);spike.rotation.x=.3;g.add(spike);
    }
    const gm=L({color:'#09090b'});
    const rimL=new THREE.Mesh(new THREE.BoxGeometry(.15,.12,.03),gm);rimL.position.set(-.09,1.56,.19);g.add(rimL);
    const rimR=new THREE.Mesh(new THREE.BoxGeometry(.15,.12,.03),gm);rimR.position.set(.09,1.56,.19);g.add(rimR);
    const bridge=new THREE.Mesh(new THREE.BoxGeometry(.06,.02,.02),gm);bridge.position.set(0,1.58,.19);g.add(bridge);
  } else if(id===2){
    const hair=new THREE.Mesh(new THREE.SphereGeometry(.22,14,12,0,Math.PI*2,0,Math.PI/1.7),hairMat);hair.position.set(0,1.65,-.01);hair.rotation.z=-.2;g.add(hair);
  } else if(id===3){
    const hairTop=new THREE.Mesh(new THREE.SphereGeometry(.24,16,14,0,Math.PI*2,0,Math.PI/1.6),hairMat);hairTop.position.set(0,1.66,-.02);g.add(hairTop);
    const hairBack=new THREE.Mesh(new THREE.CylinderGeometry(.12,.22,.65,10),hairMat);hairBack.position.set(0,1.3,-.18);hairBack.rotation.x=.35;g.add(hairBack);
  } else if(id===4){
    const hairBase=new THREE.Mesh(new THREE.SphereGeometry(.23,14,12,0,Math.PI*2,0,Math.PI/1.65),hairMat);hairBase.position.set(0,1.66,-.01);g.add(hairBase);
    for(let f=0;f<8;f++){
      const curl=new THREE.Mesh(new THREE.DodecahedronGeometry(.065),hairMat);
      curl.position.set(-.12+f*.035,1.79+Math.sin(f)*.02,.02);g.add(curl);
    }
  }

  const chest=new THREE.Mesh(new THREE.BoxGeometry(.46,.45,.28),shirtMat);chest.position.set(0,1.12,0);g.add(chest);
  g.chestRef=chest;

  if(id===1){
    const inner=new THREE.Mesh(new THREE.BoxGeometry(.18,.45,.02),L({color:'#0f172a'}));inner.position.set(0,1.12,.14);g.add(inner);
    const stringL=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.18),L({color:'#ef4444'}));stringL.position.set(-.05,1.06,.16);g.add(stringL);
    const stringR=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.18),L({color:'#ef4444'}));stringR.position.set(.05,1.06,.16);g.add(stringR);
  } else if(id===2){
    const collar=new THREE.Mesh(new THREE.TorusGeometry(.11,.02,8,16),L({color:'#ffffff'}));collar.position.set(0,1.33,0);collar.rotation.x=Math.PI/2;g.add(collar);
  } else if(id===3){
    const btn=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.02,12),L({color:'#3f2e18'}));btn.position.set(0,1.12,.15);btn.rotation.x=Math.PI/2;g.add(btn);
  } else if(id===4){
    const pocket=new THREE.Mesh(new THREE.BoxGeometry(.26,.14,.04),L({color:'#0284c7'}));pocket.position.set(0,.98,.14);g.add(pocket);
  }
  const waist=new THREE.Mesh(new THREE.BoxGeometry(.4,.18,.26),pantsMat);waist.position.set(0,.83,0);g.add(waist);

  g.arms=[-1,1].map(side=>{
    const shoulder=new THREE.Group();shoulder.position.set(side*.26,1.26,0);
    const armMesh=new THREE.Mesh(new THREE.CylinderGeometry(.065,.055,.44,10),shirtMat);armMesh.position.set(0,-.2,0);shoulder.add(armMesh);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),skinMat);hand.position.set(0,-.44,0);shoulder.add(hand);
    g.add(shoulder);return shoulder;
  });

  if(hasTrolley){
    g.arms[0].rotation.set(-.58,.15,0);
    g.arms[1].rotation.set(-.58,-.15,0);
  }

  g.legs=[-1,1].map(side=>{
    const hip=new THREE.Group();hip.position.set(side*.125,.74,0);
    const legMesh=new THREE.Mesh(new THREE.CylinderGeometry(.08,.07,.62,10),pantsMat);legMesh.position.set(0,-.31,0);hip.add(legMesh);
    const shoe=new THREE.Mesh(new THREE.BoxGeometry(.135,.1,.26),shoesMat);shoe.position.set(0,-.64,.04);hip.add(shoe);
    const sole=new THREE.Mesh(new THREE.BoxGeometry(.14,.035,.27),L({color:'#ffffff'}));sole.position.set(0,-.69,.04);hip.add(sole);
    g.add(hip);return hip;
  });

  if(hasTrolley){
    const trolley=createTrolley3D();
    trolley.position.set(0,0,.68);
    g.add(trolley);
    g.trolley=trolley;

    g.addTrolleyItem=function(itemColor){

// Safe Navigation System
const AISLE_X = [-9.6, -6.0, -2.0, 2.0, 6.0, 9.6];
const CROSS_Z = [6.8, 1.25, -4.25, -9.6];
function getClosest(val, arr){return arr.reduce((p,c)=>Math.abs(c-val)<Math.abs(p-val)?c:p)}

function planSafeAislePath(n, targetX, targetZ){
  const startAisleX = getClosest(n.x, AISLE_X);
  const targetAisleX = getClosest(targetX, AISLE_X);
  const crossZ = getClosest(n.z, CROSS_Z);
  const w = [];
  if(Math.abs(n.z - crossZ) > 0.25) w.push([startAisleX, crossZ]);
  if(Math.abs(startAisleX - targetAisleX) > 0.25) w.push([targetAisleX, crossZ]);
  w.push([targetAisleX, targetZ]);
  n.wp = w;
}

function npcTick(n,dt,T){
  const g=n.g;
  if(n.st==='wait'){
    n.t-=dt;
    if(n.t<=0){
      n.st='shop';n.n=2+Math.floor(Math.random()*3);n.k=0;n.sum=0;
      g.visible=true;g.clearTrolley();n.x=9.6;n.z=10.5;g.position.set(n.x,0,n.z);
      nextShelf(n);
    }
    return;
  }

  let steerX = 0, steerZ = 0, speedMultiplier = 1.0;
  for(const other of NP){
    if(other === n || !other.g.visible) continue;
    const dist = Math.hypot(n.x - other.x, n.z - other.z);
    if(dist < 1.5 && dist > 0.05){
      const pushStrength = (1.5 - dist) * 1.8;
      steerX += ((n.x - other.x) / dist) * pushStrength;
      steerZ += ((n.z - other.z) / dist) * pushStrength;
      if(n.wp.length > 0){
        const [tx, tz] = n.wp[0];
        const dot = (tx - n.x)*(other.x - n.x) + (tz - n.z)*(other.z - n.z);
        if(dot > 0){ steerX += 0.45; speedMultiplier = 0.65; }
      }
    }
  }

  const movedDist = Math.hypot(n.x - n.lastX, n.z - n.lastZ);
  if(movedDist < 0.05 * dt){
    n.stuckTimer += dt;
    if(n.stuckTimer > 1.8){
      n.stuckTimer = 0;
      if(n.st === 'shop' || n.st === 'queue') nextShelf(n);
    }
  } else { n.stuckTimer = 0; }
  n.lastX = n.x; n.lastZ = n.z;

  let mv = 0;
  if(n.wp.length){
    const [tx,tz]=n.wp[0];
    let dx = (tx - n.x) + steerX * 0.4;
    let dz = (tz - n.z) + steerZ * 0.4;
    const d = Math.hypot(dx,dz);

    if(d < 0.12){
      n.x = tx; n.z = tz; n.wp.shift();
    } else {
      const step = Math.min(d, 1.85 * dt * speedMultiplier);
      n.x += (dx / d) * step;
      n.z += (dz / d) * step;
      g.rotation.y = Math.atan2(dx, dz);
      mv = 1;
    }
  }

  g.position.x = n.x;
  g.position.z = n.z;
  animateTrolleyPush(g,T,mv);
  if(n.wp.length) return;

  if(n.st==='shop'){
    n.st='pick';n.t=1.4;g.rotation.y=-Math.PI/2;
    g.arms[1].rotation.set(-1.1,.6,0);
  }
  else if(n.st==='pick'){
    n.t-=dt;
    if(n.t<=0 && PR.length){
      n.k++;
      const randomProd=PR[Math.floor(Math.random()*PR.length)];
      n.sum+=randomProd.p;
      g.addTrolleyItem(randomProd.c);
      g.arms[1].rotation.set(-.58,-.15,0);
      if(n.k<n.n){n.st='shop';nextShelf(n)}else n.st='toCounter';
    }
  }
  else if(n.st==='toCounter'){
    const c=CT.filter(c=>!c.real&&c.q.length<3).sort((a,b)=>a.q.length-b.q.length)[0];
    if(c){
      n.ct=c;c.q.push(n);n.st='queue';
      planSafeAislePath(n, c.x, qz(c.q.length-1));
    }
  }
  else if(n.st==='queue'){
    const c=n.ct;g.rotation.y=0;
    if(c.q[0]===n&&!c.busy){c.busy=1;c.t=0;n.st='bill';disp(c,'SCANNING ITEMS…','#f59f00')}
  }
  else if(n.st==='bill'){
    const c=n.ct;c.t+=dt;
    if(c.t>2.8){
      disp(c,'COD: PKR '+n.sum,'#16a34a');c.busy=0;c.reset=2.5;c.q.shift();
      c.q.forEach((m,i)=>planSafeAislePath(m,c.x,qz(i)));
      n.st='exit';
      planSafeAislePath(n, 3, 10.6);
    }
  }
  else if(n.st==='exit'){g.visible=false;n.st='wait';n.t=2+Math.random()*4}
}

  ft.innerHTML=`
    <div class='r'><span>Subtotal</span><b>PKR ${sub}</b></div>
    <div class='r'><span>Sales Tax (5%)</span><b>PKR ${gst}</b></div>
    <div class='r' style='font-size:16px;border-top:2px solid #0f172a;padding-top:6px'><b>Net Total Amount</b><b>PKR ${tot}</b></div>
    <div style='margin-top:12px;font-weight:700;color:#0f172a'>Payment Mode:</div>
    <button id='codBtn' style='width:100%;background:#16a34a;margin-top:6px;font-size:15px'>💵 Confirm Cash on Delivery (COD)</button>
    <div style='font-size:11px;color:#64748b;margin-top:4px;text-align:center'>Only Cash on Delivery is available for this store.</div>
    <button id='cx' style='width:100%;margin-top:8px'>Cancel</button>
  `;

  document.getElementById('codBtn').onclick=()=>{
    ft.innerHTML='<div style="padding:14px 0;font-weight:700;color:#0284c7">⏳ Confirming Cash on Delivery Order…</div>';
    setTimeout(()=>{
      if(tok!==billTok)return;billNo++;
      const now = new Date();
      const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      ft.innerHTML=`
        <div class='r' style='background:#f0fdf4;padding:8px;border-radius:8px;color:#16a34a'><b>✅ CASH ON DELIVERY ORDER PLACED</b></div>
        <div class='r'><span>Invoice Number</span><b>INV-${billNo}</b></div>
        <div class='r'><span>Payment Method</span><b>Cash on Delivery (COD)</b></div>
        <div class='r'><span>Amount Payable</span><b>PKR ${tot}</b></div>
        <div class='r'><span>Order Time</span><b>${dateStr}</b></div>
        <button id='dlPdf' style='width:100%;background:#0284c7;margin-top:12px;font-size:14px'>📥 Download Invoice (PDF)</button>
        <button id='dn' style='width:100%;margin-top:8px'>Done / Close</button>
      `;

      document.getElementById('dlPdf').onclick=()=>{
        generatePdfInvoice(purchasedItems, sub, gst, tot, billNo, dateStr);
      };

      for(const k in cart)delete cart[k];render();trolleyClear();
      const r=CT[3];r.busy=0;r.reset=4;disp(r,'COD: PKR '+tot,'#16a34a');
      document.getElementById('dn').onclick=closeBill;
    },1000);
  };
  document.getElementById('cx').onclick=closeBill;
}

billBtn.onclick=()=>{
  const ids=Object.keys(cart);if(!ids.length)return;
  const tok=++billTok;bill.style.display='flex';CT[3].busy=1;disp(CT[3],'SCANNING ITEMS…','#f59f00');
  bc.innerHTML=`
    <div style='text-align:center;border-bottom:2px solid #0f172a;padding-bottom:6px;margin-bottom:8px'>
      <b style='font-size:16px'>HYPERMART PRIME</b>
      <div style='font-size:11px;color:#64748b'>TAX INVOICE · CASH ON DELIVERY ONLY</div>
      <div style='font-size:12px;font-weight:600;margin-top:2px'>CHECKOUT LANE 04 (EXPRESS)</div>
    </div>
    <div id='rows'></div>
    <div id='ft' style='margin-top:10px'><button id='cx'>Cancel</button></div>
  `;
  const rows=document.getElementById('rows'),ft=document.getElementById('ft');
  document.getElementById('cx').onclick=closeBill;
  let sub=0;const gap=Math.min(350,2800/ids.length);
  const purchasedItems=[];

  ids.forEach((id,k)=>setTimeout(()=>{
    if(tok!==billTok)return;
    const q=cart[id],a=q*PR[id].p;sub+=a;
    purchasedItems.push({n:PR[id].n, q, p:PR[id].p});
    rows.insertAdjacentHTML('beforeend',`<div class='r'><span>${PR[id].e} ${PR[id].n} ×${q}</span><b>PKR ${a}</b></div>`);
    if(k===ids.length-1)setTimeout(()=>{if(tok===billTok)pay(sub,tok,ft,purchasedItems)},400);
  },k*gap+200));
};

function tick(dt){
  const T=clock.elapsedTime;
  NP.forEach(n=>npcTick(n,dt,T));
  CT.forEach(c=>{
    c.ck.arms[1].rotation.x=c.busy?-0.9+Math.sin(T*10)*.35:Math.sin(T*2)*.05;
    if(c.reset>0){c.reset-=dt;if(c.reset<=0&&!c.busy)disp(c,c.real?'CHECKOUT 04 · OPEN':'LANE OPEN',c.real?'#16a34a':'#0284c7')}
  });
  const p=cam.position,near=Math.hypot(p.x-6,p.z-7.2)<2.8&&bill.style.display!=='flex';
  billBtn.style.display=near?'block':'none';
  if(near){const w=Object.keys(cart).length?'💳 Proceed to Checkout':'💳 Cart is empty';if(billBtn.textContent!==w)billBtn.textContent=w}
}

setTimeout(()=>document.getElementById('hint').style.opacity=0,8000);

// Collision & Loop
const blocked=(x,z)=>BL.some(g=>Math.abs(x-g.x)<g.hx&&Math.abs(z-g.z)<g.hz);
const clock=new THREE.Clock();

function loop(){
  const dt=Math.min(clock.getDelta(),.05),sp=3.2*dt;
  const f=keys.f-keys.b,r=keys.r-keys.l,p=cam.position;
  const nx=p.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*sp,nz=p.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*sp;
  if(!blocked(nx,p.z))p.x=nx;
  if(!blocked(p.x,nz))p.z=nz;
  p.x=Math.max(-10,Math.min(10,p.x));p.z=Math.max(-11,Math.min(10.5,p.z));
  cam.rotation.set(pitch,yaw,0);
  tick(dt);
  R.render(S,cam);
  requestAnimationFrame(loop);
}
loop();
</script>
